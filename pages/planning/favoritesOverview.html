    <main class="container my-5">
        <div class="catering-container">

            <div class="text-center mb-5">
                <h1 class="catering-title">❤️ Meine Favoriten</h1>
                <p class="catering-subtitle">
                    Hier findest du deine gespeicherten Favoriten aus Catering und Locations.
                </p>
            </div>

            <div class="text-center mb-4">
                <button class="btn btn-primary" onclick="loadFavorites()">
                    Favoriten neu laden
                </button>
            </div>

            <div id="favorites-error" class="alert alert-danger d-none text-center"></div>

            <!-- Location Favoriten -->
            <section class="my-5">
                <div class="service-card p-4">
                    <div class="d-flex align-items-center justify-content-between mb-4">
                        <h2 class="mb-0">
                            <i class="fas fa-map-marker-alt me-2"></i>
                            Location-Favoriten
                        </h2>
                        <span id="location-count" class="badge bg-secondary">0</span>
                    </div>

                    <div id="location-favorites" class="catering-grid">
                        <p class="text-muted mb-0">Lade Location-Favoriten...</p>
                    </div>
                </div>
            </section>

            <!-- Catering Favoriten -->
            <section class="my-5">
                <div class="service-card p-4">
                    <div class="d-flex align-items-center justify-content-between mb-4">
                        <h2 class="mb-0">
                            <i class="fas fa-utensils me-2"></i>
                            Catering-Favoriten
                        </h2>
                        <span id="catering-count" class="badge bg-secondary">0</span>
                    </div>

                    <div id="catering-favorites" class="catering-grid">
                        <p class="text-muted mb-0">Lade Catering-Favoriten...</p>
                    </div>
                </div>
            </section>

        </div>
    </main>

    <div id="footer-placeholder"></div>

        async function loadFavorites() {
            const locationContainer = document.getElementById("location-favorites");
            const cateringContainer = document.getElementById("catering-favorites");
            const locationCount = document.getElementById("location-count");
            const cateringCount = document.getElementById("catering-count");
            const errorBox = document.getElementById("favorites-error");

            errorBox.classList.add("d-none");
            errorBox.innerText = "";

            locationContainer.innerHTML = `<p class="text-muted mb-0">Lade Location-Favoriten...</p>`;
            cateringContainer.innerHTML = `<p class="text-muted mb-0">Lade Catering-Favoriten...</p>`;

            try {
                const res = await fetch("/favorites", {
                    method: "GET",
                    credentials: "include"
                });

                const data = await res.json();

                if (!data.success) {
                    throw new Error(data.message || "Favoriten konnten nicht geladen werden");
                }

                const favorites = data.favorites || [];

                const locationFavorites = favorites.filter(fav => fav.item_type === "location");
                const cateringFavorites = favorites.filter(fav => fav.item_type === "catering");

                locationCount.innerText = locationFavorites.length;
                cateringCount.innerText = cateringFavorites.length;

                renderFavorites(locationContainer, locationFavorites, "location");
                renderFavorites(cateringContainer, cateringFavorites, "catering");

            } catch (err) {
                console.error("Fehler beim Laden der Favoriten:", err);

                locationContainer.innerHTML = "";
                cateringContainer.innerHTML = "";

                errorBox.innerText = "Favoriten konnten nicht geladen werden.";
                errorBox.classList.remove("d-none");
            }
        }

        function renderFavorites(container, favorites, type) {
            container.innerHTML = "";

            if (favorites.length === 0) {
                const emptyText = type === "location"
                    ? "Du hast noch keine Location-Favoriten gespeichert."
                    : "Du hast noch keine Catering-Favoriten gespeichert.";

                container.innerHTML = `
                    <p class="text-muted mb-0">${emptyText}</p>
                `;
                return;
            }

            favorites.forEach((favorite) => {
                const itemId = String(favorite.item_id);
                const itemData = type === "location"
                    ? locationData[itemId]
                    : cateringData[itemId];

                if (!itemData) {
                    return;
                }

                const card = document.createElement("div");
                card.className = "catering-card";

                card.innerHTML = `
                    <button class="favorite-btn active" data-type="${type}" data-item-id="${itemId}">
                        <i class="fa-solid fa-heart"></i>
                    </button>

                    <div class="catering-card-icon">
                        <i class="fas ${itemData.icon}"></i>
                    </div>

                    <h3 class="catering-card-title">${itemData.title}</h3>

                    <p class="catering-card-description">
                        ${itemData.description}
                    </p>

                    <div class="catering-card-details">
                        <p>
                            <i class="fas fa-map-marker-alt"></i>
                            ${itemData.location}
                        </p>
                    </div>

                    <p class="small text-muted">
                        Gespeichert am: ${formatDate(favorite.created_at)}
                    </p>

                    <a href="${itemData.link}" class="catering-card-btn">
                        Zur Übersicht
                    </a>
                `;

                container.appendChild(card);
            });
        }

        function formatDate(dateString) {
            if (!dateString) return "-";

            const date = new Date(dateString);

            return new Intl.DateTimeFormat("de-AT", {
                day: "2-digit",
                month: "2-digit",
                year: "numeric"
            }).format(date);
        }

        document.addEventListener("DOMContentLoaded", () => {
            loadFavorites();
        });
