<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="/CSS/global.css">
  <link rel="stylesheet" href="/CSS/guestCode.css">
  <link rel="icon" type="image/x-icon" href="/assets/favicon/favicon.ico">
  <title>Gast-Code - JAMMM Together</title>
</head>
<body>
  <div id="navbar-placeholder"></div>

  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="guest-code-card">
          <h2 class="guest-code-title"><i class="fas fa-key"></i> Gast-Code verwalten</h2>
          <p class="guest-code-subtitle">
            Teilen Sie diesen Code mit Ihren Gästen. Sie können sich damit anmelden und erhalten Lese-Zugriff auf Kalender und Wunschliste.
          </p>

          <form id="guestCodeForm">
            <div class="mb-3">
              <label for="guestCode" class="form-label">Ihr Gast-Code</label>
              <input type="text" id="guestCode" class="guest-code-input" placeholder="z. B. hochzeit2026" maxlength="50">
              <div class="form-hint">Sie können einen beliebigen, leicht zu merkenden Code wählen. Lassen Sie das Feld leer, um keinen Gast-Zugang zu ermöglichen.</div>
            </div>
            <button type="submit" class="guest-code-btn">Code speichern</button>
            <div id="codeMessage" class="mt-3 text-center" style="display: none;"></div>
          </form>

          <div class="text-center mt-3">
            <a href="/pages/dashboard/tempPersonalDashboard.html" class="back-link"><i class="fas fa-arrow-left"></i> Zurück zum Dashboard</a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/auth-guard.js"></script>
  <script>
    checkAuth({ requireAuth: true });
  </script>
  <script src="/js/auth-nav.js"></script>
  <script src="/js/navbar-loader.js"></script>
  <script src="/js/footer-loader.js"></script>
  <script>
    const form = document.getElementById("guestCodeForm");
    const input = document.getElementById("guestCode");
    const msg = document.getElementById("codeMessage");

    function showMessage(text, success) {
      msg.textContent = text;
      msg.style.display = "block";
      msg.style.color = success ? "green" : "red";
    }

    // Aktuellen Code beim Laden vorausfüllen
    fetch("/user/guest-code")
      .then(r => r.json())
      .then(data => {
        if (data.success && data.guest_access_code) {
          input.value = data.guest_access_code;
        }
      });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const code = input.value.trim();

      // Leeres Feld = Code löschen
      if (!code) {
        const res = await fetch("/user/guest-code", { method: "DELETE" });
        const data = await res.json();
        showMessage(data.success ? "Gast-Zugang wurde deaktiviert." : data.message, data.success);
        return;
      }

      const res = await fetch("/user/guest-code", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ guest_access_code: code })
      });
      const data = await res.json();
      showMessage(
        data.success ? "Code erfolgreich gespeichert!" : data.message,
        data.success
      );
    });
  </script>
</body>
</html>
