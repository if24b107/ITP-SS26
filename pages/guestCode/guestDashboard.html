<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/CSS/global.css">
    <link rel="stylesheet" href="/CSS/guestCode.css">
    <link rel="icon" type="image/x-icon" href="/assets/favicon/favicon.ico">
    <title>Gast-Dashboard - JAMMM Together</title>
</head>
<body>
    
    <div id="navbar-placeholder"></div>
    <script src="/js/guest-auth.js"></script>
    <script src="/js/navbar-guest-loader.js"></script>


    <main class="container my-5">
        <h1 class="section-title text-center mb-5">👋 Gast-Zugang</h1>

        <div class="row justify-content-center g-4">
            <!-- KALENDER -->
            <div class="col-md-5">
                <div class="service-card text-center">
                    <div class="icon-wrapper">
                        <i class="fas fa-calendar-alt"></i>
                    </div>
                    <h3>Kalender ansehen</h3>
                    <p>Sehen Sie sich die Termine des Brautpaares an.</p>
                    <a href="/pages/guestCode/guestCalendar.html" class="btn btn-primary">
                        Zum Kalender
                    </a>
                </div>
            </div>

            <!-- WUNSCHLISTE -->
            <div class="col-md-5">
                <div class="service-card text-center">
                    <div class="icon-wrapper">
                        <i class="fas fa-gift"></i>
                    </div>
                    <h3>Wunschliste ansehen</h3>
                    <p>Entdecken Sie die Geschenkwünsche des Brautpaares.</p>
                    <a href="/pages/guestCode/guestWishlist.html" class="btn btn-primary">
                        Zur Wunschliste
                    </a>
                </div>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/footer-loader.js"></script>

    <!-- Footer-Zusatz-Styling -->
    <style>
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        main {
            flex: 1;
        }
    </style>
</body>
</html>
