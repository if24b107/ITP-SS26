<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="/CSS/global.css">
  <link rel="stylesheet" href="/CSS/loginAndRegistration.css">
  <link rel="icon" type="image/x-icon" href="/assets/favicon/favicon.ico">
  <title>Gast-Login – JAMMM Together</title>
</head>
<body>

  <div id="navbar-placeholder"></div>

  <section class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="login-card p-5">
      <h2 class="text-center mb-4">Gast-Zugang</h2>
      <p class="text-center text-muted mb-4">Bitte geben Sie den Gast-Code ein, den Sie vom Brautpaar erhalten haben.</p>

      <form id="guestLoginForm">
        <div class="mb-3">
          <label class="form-label">Gast-Code</label>
          <input type="text" id="guestCode" class="form-control" placeholder="z. B. hochzeit2026" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 login-btn-main">
          Als Gast anmelden
        </button>
        <div id="guestLoginError" class="error-msg text-center mt-3" style="display: none;"></div>
      </form>

      <div class="text-center mt-3">
        <span>Sie sind das Brautpaar?</span>
        <a href="login.html" class="small-link">Hier anmelden</a>
      </div>
    </div>
  </section>

  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/auth-nav.js"></script>
  <script src="/js/navbar-loader.js"></script>
  <script src="/js/footer-loader.js"></script>
  <script>
    const form = document.getElementById('guestLoginForm');
    const errorDiv = document.getElementById('guestLoginError');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const code = document.getElementById('guestCode').value.trim();

      if (!code) {
        errorDiv.textContent = 'Bitte geben Sie einen Code ein.';
        errorDiv.style.display = 'block';
        return;
      }

      try {
        const response = await fetch('/guest-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ code })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          // Erfolg -> Weiterleitung zum Gast-Dashboard (noch ergänzen)
          window.location.href = '/pages/guestCode/guestDashboard.html';
        } else {
          errorDiv.textContent = data.message || 'Ungültiger Gast-Code. Bitte versuchen Sie es erneut.';
          errorDiv.style.display = 'block';
        }
      } catch (err) {
        console.error('Fehler beim Gast-Login:', err);
        errorDiv.textContent = 'Verbindungsfehler. Bitte versuchen SIe es später erneut.';
        errorDiv.style.display = 'block';
      }
    });
  </script>
</body>
</html>
