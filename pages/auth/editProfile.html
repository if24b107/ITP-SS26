<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil bearbeiten - JAMMM Together</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/CSS/global.css">
    <link rel="stylesheet" href="/CSS/loginAndRegistration.css">
    <link rel="icon" type="image/x-icon" href="/assets/favicon/favicon.ico">
</head>
<body>
    <div id="navbar-placeholder"></div>

    <section class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
        <div class="login-card p-5">
            <h2 class="text-center mb-4">
                <i class="fas fa-user-edit"></i> Profil bearbeiten
            </h2>
            <form id="editProfileForm">
                <div class="mb-3">
                    <label class="form-label">Benutzername</label>
                    <input type="text" id="username" class="form-control" placeholder="Dein Benutzername" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">E-Mail</label>
                    <input type="email" id="email" class="form-control" placeholder="deine@email.com" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 login-btn-main">Speichern</button>
                <div id="editProfileMessage" class="text-center mt-3 small"></div>
            </form>

            <hr class="my-4">

            <h5 class="text-center mb-3"><i class="fas fa-lock"></i> Passwort ändern</h5>
            <form id="changePasswordForm">
                <div class="mb-3">
                    <label class="form-label">Aktuelles Passwort</label>
                    <input type="password" id="current_password" class="form-control" placeholder="Aktuelles Passwort" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Neues Passwort</label>
                    <input type="password" id="new_password" class="form-control" placeholder="Neues Passwort (min. 6 Zeichen)" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Neues Passwort bestätigen</label>
                    <input type="password" id="confirm_password" class="form-control" placeholder="Neues Passwort wiederholen" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 login-btn-main">Passwort ändern</button>
                <div id="changePasswordMessage" class="text-center mt-3 small"></div>
            </form>
        </div>
    </section>

    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/auth-guard.js"></script>
    <script>
        checkAuth({ requireAuth: true });
    </script>
    <script src="/js/auth-nav.js"></script>
    <script src="/js/navbar-loader.js"></script>
    <script src="/js/footer-loader.js"></script>
    <script>
        // Eigene Daten beim Laden befüllen
        async function loadUserData() {
            try {
                const res = await fetch("/user");
                const json = await res.json();
                if (json.success) {
                    document.getElementById("username").value = json.user.username || "";
                    document.getElementById("email").value = json.user.email || "";
                }
            } catch (err) {
                console.error("Fehler beim Laden:", err);
            }
        }

        // Eigene Daten speichern
        document.getElementById("editProfileForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const username = document.getElementById("username").value.trim();
            const email = document.getElementById("email").value.trim();
            const msg = document.getElementById("editProfileMessage");

            try {
                const res = await fetch("/user", {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, email })
                });
                const json = await res.json();
                if (json.success) {
                    msg.style.color = "green";
                    msg.innerText = "Profil erfolgreich gespeichert.";
                } else {
                    msg.style.color = "red";
                    msg.innerText = json.message || "Fehler beim Speichern.";
                }
            } catch (err) {
                msg.style.color = "red";
                msg.innerText = "Serverfehler.";
            }
        });

        // Passwort ändern
        document.getElementById("changePasswordForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const current_password = document.getElementById("current_password").value;
            const new_password = document.getElementById("new_password").value;
            const confirm_password = document.getElementById("confirm_password").value;
            const msg = document.getElementById("changePasswordMessage");

            try {
                const res = await fetch("/user/password", {
                    method: "PATCH",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ current_password, new_password, confirm_password })
                });
                const json = await res.json();
                if (json.success) {
                    msg.style.color = "green";
                    msg.innerText = "Passwort erfolgreich geändert.";
                    document.getElementById("changePasswordForm").reset();
                } else {
                    msg.style.color = "red";
                    msg.innerText = json.message || "Fehler beim Ändern.";
                }
            } catch (err) {
                msg.style.color = "red";
                msg.innerText = "Serverfehler.";
            }
        });

        loadUserData();
    </script>
</body>
</html>
